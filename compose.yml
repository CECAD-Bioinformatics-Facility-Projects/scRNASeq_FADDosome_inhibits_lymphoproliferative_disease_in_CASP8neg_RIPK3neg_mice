name: faddosome-casp8-ripk3-validation-rep2
services:
  rstudio:
    image: faddosome-casp8-ripk3-rep2:4.4.1
    build:
     context: .
     dockerfile: docker/Dockerfile
    container_name: scrnaseq-fritsch-et-al-2025-rep2
    ports:
      - "50363:8787"
    volumes:
      - type: "bind"
        source: "./config"
        target: "/home/rstudio/.config/rstudio"
      - type: "bind"
        source: "."
        target: "/home/rstudio/project"
    environment:
      - USERNAME=aabdallah
      - USERID=1000
      - GROUPID=1000
      - USER=rstudio
      - PASSWORD=1rstudio